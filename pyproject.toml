[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "md-templates"
version = "0.3.0.dev0"
description = "Reusable OpenMM templates for explicit-water molecular dynamics and omega-selective REST2."
readme = "README.md"
requires-python = ">=3.11"
# The scientific stack -- openmm, openff-toolkit, openmmforcefields, ambertools, parmed, rdkit --
# comes from the conda environment `md-template install` creates (see environment-ci.yml for the
# same list). Install this package into that environment with `--no-deps`, or pip will resolve a
# second, pip-built OpenMM alongside the conda one. Only the pure-Python core is declared here.
dependencies = [
    "pyyaml",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "build"]

# The entry point. Installing the wheel puts `md-openmm` on PATH, which is what lets a
# consuming project run the pipeline without a source checkout.
[project.scripts]
md-template = "md_templates.cli.md_template:main"
md-openmm = "md_templates.cli.md_openmm:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["md_templates*"]

[tool.setuptools.package-data]
# `md-gen` writes a generated project by COPYING these files. A wheel without them installs an
# md-gen that cannot write anything, which is why tests/test_wheel.py checks the built wheel
# rather than trusting this glob.
"md_templates.openmm" = ["templates/*.py", "templates/*.sh"]

[tool.pytest.ini_options]
# The MD smoke tests build systems and integrate them, so they are marked slow and run before a
# release rather than on every commit. `pytest tests/ -m "not slow"` is the fast lane.
testpaths = ["tests"]
markers = [
    "slow: builds a system or runs dynamics (deselect with '-m \"not slow\"')",
    # Anything that minimises or integrates a molecular system. These run on CUDA and are the
    # only evidence that the runtime works; a CPU-only machine cannot produce that evidence, so
    # they are DESELECTED there rather than quietly passing on the wrong platform.
    "gpu: needs a working CUDA platform (deselect with '-m \"not gpu\"')",
]
