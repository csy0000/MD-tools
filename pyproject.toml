[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "md-templates"
version = "0.1.1"
description = "Reusable OpenMM templates for explicit-water molecular dynamics and omega-selective REST2."
readme = "README.md"
requires-python = ">=3.11"
# Heavy scientific dependencies (openmm, openmmtools, ambertools, rdkit, mdtraj, deeptime, ...)
# are provided by the conda environment defined in environment.yml — install the package with
# `pip install -e . --no-deps` inside that env. Only the pure-Python, pip-resolvable core is listed here.
# The heavy scientific stack (openmm, openff-toolkit, ambertools, rdkit, parmed) comes from the
# conda environment `md-template install` creates. Only the pure-Python core is listed here.
dependencies = [
    "pyyaml",
    "numpy",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "build"]

# The entry point. Installing the wheel puts `md-openmm` on PATH, which is what lets a
# consuming project run the pipeline without a source checkout.
[project.scripts]
md-template = "md_templates.cli.md_template:main"
md-openmm = "md_templates.cli.md_openmm:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["md_templates*"]

# The shipped system/experiment manifests must travel inside the wheel: `--system cyclo_rgdfv`
# resolving to a package resource is what keeps the documented commands free of machine-local
# paths. The directory is `manifests/`, NOT `data/` — this repository gitignores `data/` at any
# depth, which would silently keep these files out of version control.
[tool.setuptools.package-data]
# The generated projects are copies of these. A wheel without them has a `md-gen` that cannot
# write anything.
"md_templates.openmm" = ["templates/*.py", "templates/*.sh"]

[tool.pytest.ini_options]
# The MD smoke tests build systems and integrate them, so they are marked slow and run before a
# release rather than on every commit. `pytest tests/ -m "not slow"` is the fast lane.
testpaths = ["tests"]
markers = [
    "slow: builds a system or runs dynamics (deselect with '-m \"not slow\"')",
]
