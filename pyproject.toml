[build-system]
requires = ["setuptools>=64"]
# An in-tree backend that wraps setuptools and bakes the source commit into the distribution
# before delegating. See `_build_backend.py` for why a wheel cannot work this out afterwards.
build-backend = "_build_backend"
backend-path = ["."]

[project]
name = "md-tools"
version = "0.5.3"
description = "Standalone OpenMM tooling: topology construction, MD script generation, and transactional dataset registration."
readme = "README.md"
requires-python = ">=3.11"
# The scientific stack -- openmm, openff-toolkit, openmmforcefields, ambertools, parmed, rdkit --
# comes from your conda environment (see environment-ci.yml for the list this is developed
# against). Install this package into that environment with `--no-deps`, or pip will resolve a
# second, pip-built OpenMM alongside the conda one. Only the pure-Python core is declared here.
dependencies = [
    "pyyaml",
    "numpy",
    # The dataset contract is a pydantic model, and the published JSON schema is generated FROM
    # that model, so the validator that runs and the schema that is published cannot drift apart.
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "build"]
# Multi-rank REST2, rREST2 and AIS. Deliberately an EXTRA rather than a dependency: an ordinary
# serial user needs no MPI at all, and installing mpi4py pulls a whole MPI implementation with it.
# What is NOT optional is the behaviour -- a launch of more than one rank without a working mpi4py
# is a fatal preflight error, never a quietly serial run. See `md_tools.remd.mpi`.
mpi = ["mpi4py>=3.1"]

# The ONLY entry point. Installing the wheel puts `md-openmm` on PATH, which is what lets a
# consuming project run the whole pipeline with no source checkout and no component lock.
[project.scripts]
md-openmm = "md_tools.cli.md_openmm:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["md_tools*"]

[tool.setuptools.package-data]
# `openmm/templates/` is gone. What it held was installed runtime code, not templates, and it is
# now ordinary packages -- md_tools.md, md_tools.rest2, md_tools.remd, md_tools.ais -- found by
# `[tool.setuptools.packages.find]` above. Nothing here needs to list them.
# The configuration examples are deliberately NOT package data, so they are not listed here. They
# ship as wheel data files -- see [tool.setuptools.data-files] below -- which is what lets the
# repository root hold exactly one browsable, hand-edited copy: no symlink, and no second mirror
# inside the package. `md_tools.configs.example_root()` finds the installed copies through the
# distribution's own metadata, falling back to the source tree when running from a checkout.
# `importlib.resources` is the right tool for genuine package resources, such as the runtime
# modules above and the schemas below; a config example a user is meant to read and copy is not one.
# The generated JSON schema and the v1-to-v2 migration note travel with the contract they
# describe, so an installed wheel can be checked against them without the repository.
"md_tools.data_contract" = ["schemas/*.json", "*.md"]

# The configuration examples ship as wheel data files: pip unpacks them under <prefix>/share/,
# and `md_tools.configs.example_root()` asks the installed distribution's metadata where they went.
# One copy, at the repository root, browsable on GitHub as an ordinary directory.
[tool.setuptools.data-files]
"share/md-tools/configs/machine" = ["configs/machine/user.config.example"]
"share/md-tools/configs/sys" = ["configs/sys/build-top.config"]
"share/md-tools/configs/md" = [
    "configs/md/cMD.config",
    "configs/md/REST2.config",
    "configs/md/rREST2.config",
    "configs/md/AIS.config",
]

[tool.pytest.ini_options]
# The MD smoke tests build systems and integrate them, so they are marked slow and run before a
# release rather than on every commit. `pytest tests/ -m "not slow"` is the fast lane.
testpaths = ["tests"]

# `loadgroup` rather than the default `load`, and it is HERE rather than on the command line so
# that a plain `pytest -n 24` gets it too.
#
# Under `load`, xdist scatters a module's tests across workers, and a module-scoped fixture is
# then built once PER WORKER that drew one of them. For a fixture that builds a system and runs a
# replica ladder, that is the same expensive work several times over, concurrently -- which is
# how a 300-second subprocess timeout started firing after two tests stopped depending on each
# other's output and began depending on the fixture instead.
#
# `loadgroup` behaves exactly like `load` except that tests marked `xdist_group("<name>")` are
# sent to the same worker. Modules whose module-scoped fixture is expensive carry that marker, so
# their fixture is built once again. Everything unmarked distributes as before.
addopts = "--dist loadgroup"
markers = [
    "slow: builds a system or runs dynamics (deselect with '-m \"not slow\"')",
    # Anything that minimises or integrates a molecular system. These run on CUDA and are the
    # only evidence that the runtime works; a CPU-only machine cannot produce that evidence, so
    # they are DESELECTED there rather than quietly passing on the wrong platform.
    "gpu: needs a working CUDA platform (deselect with '-m \"not gpu\"')",
    # Registered so `--strict-markers` stays usable; xdist provides the behaviour.
    "xdist_group: run this module's tests on ONE worker, so its module-scoped fixture is built once",
]
