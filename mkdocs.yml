# The documentation site: https://csy0000.github.io/MD-tools/
#
# WHAT IS PUBLISHED, AND WHAT IS NOT. The site carries the three things a user needs -- set up an
# environment, configure a machine, run a simulation -- plus the reference pages that justify the
# defaults. Development evidence stays in the repository and off the site: history/, campaigns/,
# integration/, amber-like-fix/, claudecode-instructions/, migration/, reports/, the backlog, and
# the dated release-note evidence files. They are kept because the reasoning in them is worth
# more than the deletion would be; they are not published because a reader cannot tell an
# evidence note from an instruction.
#
# `docs/md-configuration.md` IS GENERATED (`md_tools.build.manual.render()`) and
# `tests/test_configuration_manual.py` fails on a hand-edit. The site renders the committed file;
# it must never be authored here.
#
# Build it the way CI does:
#     pip install mkdocs-material mkdocs-exclude
#     mkdocs build --strict

site_name: MD-tools
site_description: >-
  OpenMM tools for building systems, generating MD workflows, running them on CUDA,
  and registering the result as a verified dataset.
site_url: https://csy0000.github.io/MD-tools/
repo_url: https://github.com/csy0000/MD-tools
repo_name: csy0000/MD-tools
edit_uri: edit/dev/docs/

docs_dir: docs

theme:
  name: material
  features:
    # `indexes` lets a section's first entry BE that section's page, so "Methods" and "AIS" are
    # landing pages rather than folders a reader has to click past. `expand` opens the tree so the
    # nesting is visible at a glance instead of being discovered by clicking; `prune` keeps the
    # rendered sidebar to the current subtree, which is what makes a deep tree usable rather than
    # a wall.
    - navigation.indexes
    - navigation.expand
    - navigation.prune
    - navigation.top
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

plugins:
  - search

# KEPT IN THE REPOSITORY, KEPT OFF THE SITE. See the header for why. This is MkDocs' own
# `exclude_docs` (1.5+), gitignore-style, rather than a third-party plugin: the core does the job,
# and `mkdocs-exclude` is in any case broken against MkDocs 1.6.
exclude_docs: |
  backlog.md
  promoting-a-method.md
  # The docs/ directory's own index, for someone browsing the repository on GitHub. The site has
  # `index.md` instead: a listing of this directory would only duplicate the navigation the theme
  # already renders, and it links to pages that are deliberately unpublished.
  #
  # LEADING SLASH, and it is load-bearing. These patterns are gitignore-style, so a bare
  # `README.md` matches EVERY README in the tree by basename -- which silently excluded the
  # collective-variables, data-registration, method-index and all five method pages, turning
  # eight nav entries into references to nothing. Anchored to the docs root, it matches one file.
  /README.md
  history/
  campaigns/
  integration/
  amber-like-fix/
  claudecode-instructions/
  migration/
  reports/
  release-notes/2026*
  release-notes/cuda-coverage-matrix.md

markdown_extensions:
  - admonition
  - attr_list
  # REQUIRED BY THE `grid cards` BLOCK on the home page, and by any other Markdown nested inside
  # raw HTML. Without it the content of `<div class="grid cards" markdown>` is emitted verbatim:
  # the page shows literal asterisks and unclickable `[text](link.md)` syntax, and every link in
  # the block stops being a link. `attr_list` alone does not do this.
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true

# NESTED BY WHAT A READER IS DOING, not by where the file sits. The top level is the four
# questions someone arrives with -- how do I install it, how do I run something, which method do I
# want, and what justifies the defaults -- and each opens into the steps of that task. A section
# whose first entry is a page (`navigation.indexes`) uses that page as its own landing, so
# "Methods" is the method index rather than a bare folder that has to be clicked through.
nav:
  - Home: index.md
  - Getting started:
      - Installing: install.md
      - Machine configuration: machine-configuration.md
  - Tutorials:
      - tutorial/README.md
      - cMD:
          - Paracetamol: tutorial/cMD/paracetamol.md
          - Chinolin: tutorial/cMD/chinolin.md
      - REST2:
          - Paracetamol: tutorial/REST2/paracetamol.md
          - Chinolin: tutorial/REST2/chinolin.md
      - AIS:
          - Alanine dipeptide: tutorial/AIS/alanine.md
          - Paracetamol: tutorial/AIS/paracetamol.md
      - Archived:
          - tutorial/archived/README.md
          - 0.5.3 cMD paracetamol: tutorial/archived/0.5.3/cMD/paracetamol.md
          - 0.5.3 cMD Chinolin: tutorial/archived/0.5.3/cMD/chinolin.md
          - 0.5.3 REST2 paracetamol: tutorial/archived/0.5.3/REST2/paracetamol.md
  - Running a simulation:
      - The commands:
          - Building a system (build-top): build-top.md
          - Running a stage or ladder (md-run): md-run.md
      - What a run writes:
          - The run layout: run-layout.md
          - Collective variables: collective_variables/README.md
      - Configuration:
          - Every key, generated: md-configuration.md
  - Methods:
      - openmm_methods/README.md
      - Equilibrium:
          - cMD: openmm_methods/cMD/README.md
          - Umbrella sampling: openmm_methods/umbrella/README.md
      - Enhanced sampling:
          - REST2: openmm_methods/REST2/README.md
          - AIS:
              - openmm_methods/AIS/README.md
              - Implementation: openmm_methods/AIS/AIS_implementation.md
  - Data:
      - Registering a finished run: data_register/README.md
      - The dataset contract: data-contract.md
  - Reference:
      - Scientific defaults: scientific-defaults.md
      - Support matrix: support-matrix.md
      - Releases:
          - 0.5.4: release-notes/v0.5.4.md
          - 0.5.3: release-notes/v0.5.3.md
          - 0.5.2: release-notes/v0.5.2.md
          - 0.5.1: release-notes/v0.5.1.md
          - 0.5.0: release-notes/v0.5.0.md
