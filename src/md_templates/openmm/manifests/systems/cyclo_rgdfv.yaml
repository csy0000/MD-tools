# Canonical cyclo-(RGDfV) system manifest — the exact molecule this project simulates.
#
# This is the ZWITTERION as simulated: the Asp side chain is deprotonated ([O-]) and the Arg
# guanidinium is protonated ([NH2+]), so the net formal charge is exactly zero. That is not a
# convention, it is what the AM1-BCC charges and the ion count were built against, and
# `md-openmm validate-system` refuses any other molecule under this system_id.
#
# NOTE on the force-field route. cyclo-(RGDfV) is parameterised here as a LIGAND through
# openff-2.2.0 (Sage) + AM1-BCC, not as an ff19SB peptide. The distinction cannot be inferred from
# the name — it is a cyclic pentapeptide, so "peptide" is a defensible guess and a wrong one — and
# an ff19SB run of this molecule would be a different calculation with the same name. The route is
# therefore declared, and `protein_forcefield: null` makes an accidental ff19SB load an error.
#
# `systems/cyclo_rgdfv/system.yaml` in the source tree is the SCIENTIFIC system definition used by
# the implicit-solvent AIS work and records `forcefield: ff19SB` for its REMD reference; it is a
# different artifact for a different calculation and is not interchangeable with this one.
schema_version: 1
system_id: cyclo_rgdfv
display_name: cyclo-RGDfV

input:
  route: smiles
  smiles: "CC(C)[C@@H]1NC(=O)[C@@H](Cc2ccccc2)NC(=O)[C@H](CC(=O)[O-])NC(=O)CNC(=O)[C@H](CCCNC(N)=[NH2+])NC1=O"
  canonical_isomeric_smiles: "CC(C)[C@@H]1NC(=O)[C@@H](Cc2ccccc2)NC(=O)[C@H](CC(=O)[O-])NC(=O)CNC(=O)[C@H](CCCNC(N)=[NH2+])NC1=O"
  canonical_smiles_sha256: "59d4422635f77292ed94c609a76808df5c97110be09cd9779819270363143159"
  expected_formal_charge: 0

parameterization:
  small_molecule_forcefield: openff-2.2.0
  charge_method: am1bcc
  protein_forcefield: null
  water_forcefield: amber19/tip3pfb.xml

# BOX SHAPE IS EVIDENCE, NOT A DEFAULT. The ten-rung ladder was selected on a system prepared as a
# DODECAHEDRON, and attaching that evidence to a cube would silently change the solvent geometry
# the acceptance statistics were measured in. Proven, not inferred, from the Phase-A prepared
# system that fed all six matched pilots (they copy rgd_simbox.json from it; see
# reports/explicit_solvent_validation/20260814_v2/raw_exchange/pilots6_command.sh):
#
#   reports/explicit_solvent_validation/20260814_v2/phaseA_prepared_system/rgd_simbox.json
#   sha256 ea1c14edb7c9fc949d892fb41fb733750179555c235b3d6a0a54c7bda821ac61
#     geometry.box_shape             dodecahedron
#     geometry.box_width_nm          3.66182      (grown_for_cutoff: false)
#     geometry.min_image_distance_nm 2.5893       at a 1.0 nm cutoff
#     realised_ionic_strength_molar  0.15903      (Na+ 3 / Cl- 3, 1047 waters, 3226 particles)
#
# That file was copied out of a job temp directory, which is not durable storage; the repository
# copy above is the one to cite.
solvation:
  water_model: tip3p
  padding_nm: 1.2
  box_shape: dodecahedron
  ionic_strength_molar: 0.15
  positive_ion: Na+
  negative_ion: Cl-

# Molecular facts recorded for the reader; they are re-derived and checked at validation time,
# so they cannot drift away from the SMILES above without failing.
chemistry:
  molecular_formula: C26H38N8O7
  n_stereocentres: 4
  sequence: cyclo-(Arg-Gly-Asp-D-Phe-Val)
