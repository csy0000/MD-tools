# Tiny smoke experiment: three rungs, picoseconds, CPU-sized.
#
# This exists to prove the package installs and mechanically executes on a machine that has never
# seen the repository — build a System, place every replica, propagate, attempt exchanges, write a
# valid exchange log, and produce a complete run directory. It is NOT a scientific run: the budget
# is far too short to say anything about acceptance, convergence, or a ladder.
#
# Exchange arithmetic, which the loader checks before anything expensive happens:
#   chunk 0.001 ns = 1 ps = 500 steps at 2 fs; exchange 0.5 ps = 250 steps; 500 / 250 = 2 rounds
#   per chunk, and 0.002 ns total = 2 chunks, so 4 exchange rounds — above the 2 the acceptance
#   criterion requires.
schema_version: 2
experiment_id: smoke
master_seed: 20260814
ladder_status: unvalidated

integrator:
  kind: langevin-middle
  temperature_k: 300.0
  timestep_fs: 2.0

rest2:
  scale_factors: [1.0, 0.5625, 0.25]
  exchange_interval_ps: 0.5
  relaxation_ps: 0.2
  # n_chunks * chunk_ns = 2 * 0.001 = 0.002 ns per replica,
  # derived and reported; the plan is what is declared.
  n_chunks: 2
  chunk_ns: 0.001

# Conventional MD declares its own plan: a REST2 ladder says nothing about how long ONE walker
# should run, and this template refuses to guess rather than fall back to a package default.
md:
  n_chunks: 2
  chunk_ns: 0.001
  scale_factor: 1.0

platform:
  precision: mixed

# Minutes, not the baseline's 2 ns staged protocol. A smoke that equilibrates properly is not a
# smoke; nothing here is suitable for production.
equilibration:
  protocol: simple
  timestep_fs: 1.0
  nvt_ps: 2.0
  npt_ps: 2.0
  minimize_max_iterations: 200
  box_average_last_ps: 1.0

# Reporting intervals must be shorter than a 1 ps chunk or no frame is ever written and the run
# "succeeds" with empty output.
overrides:
  system_build:
    # 0.7 nm, not the baseline 1.0: paired with 1.2 nm padding it puts the box comfortably above
    # the minimum-image limit instead of exactly on it. See small_macrocycle_smoke.yaml. This is a
    # speed choice for a smoke and is far too short for production electrostatics.
    nonbonded_cutoff_nm: 0.7
  production:
    report:
      all_atom_ps: 0.5
      solute_ps: 0.2
      state_ps: 0.2
      checkpoint_ps: 0.5
