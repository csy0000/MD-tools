# cyclo-(RGDfV) REST2: the ten-rung working ladder.
#
# PILOT-SUPPORTED FOR RGD ONLY. Selected by three matched 2 ns/replica pilots against the 8-rung control
# (median worst-pair acceptance 0.140 -> 0.240, pooled minimum 0.173 -> 0.277). The evidence is one
# molecule. Applying this ladder to cyclosporin or to the RGD derivatives is not supported by it —
# use macrocycle_pilot_8rung.yaml and run a new pair-resolved acceptance pilot.
#
# `pilot_supported` is a claim about THIS system only, and it is weaker than "validated": the
# predeclared conjunctive acceptance rule was not formally satisfied, because condition 5 was
# under-specified at the time. It means "adopted as the working ladder on declared
# system-specific pilot evidence". It does NOT mean converged, production-ready, or a formal pass
# of every predeclared condition.
#
# Spacing is even in sqrt(s) from s=1.0 to s=0.25: exchange acceptance depends on the overlap of
# neighbouring rungs' energy distributions, whose width scales roughly as sqrt(s), so even spacing
# there gives roughly even acceptance along the chain.
schema_version: 1
experiment_id: rgd_rest2_10rung
master_seed: 20260814
ladder_status: pilot_supported

integrator:
  kind: langevin-middle
  temperature_k: 300.0
  # 4 fs requires hydrogen-mass repartitioning; the 2 fs / 4 fs equivalence gate is NOT closed,
  # which is one of the two reasons long production remains blocked. See PORTABLE_REST2.md.
  timestep_fs: 4.0

rest2:
  # EXACT values, not rounded. These are rest2_ladder(1.0, 0.25, 10, "sqrt") to full precision and
  # a test compares all ten against that rule to 1e-12 — the rule is the single definition, this is
  # a serialisation of it. Six-decimal truncation was here before and is a silent perturbation of
  # the ladder the pilots actually ran.
  scale_factors: [1.000000000000, 0.891975308642, 0.790123456790, 0.694444444444,
                  0.604938271605, 0.521604938272, 0.444444444444, 0.373456790123,
                  0.308641975309, 0.250000000000]
  exchange_interval_ps: 10.0
  relaxation_ps: 10.0
  total_ns_per_replica: 2.0
  chunk_ns: 1.0

platform:
  precision: mixed
