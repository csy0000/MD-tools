name: integration-cpu

# The portability gate. It prepares both canonical routes, moves the bundles somewhere unrelated,
# DELETES the directories they were built in, and then validates, runs and resumes from the copies
# using the installed wheel with no checkout on the path.
#
# CPU only. Nothing here assumes CUDA, and the CI environment omits the CUDA pin deliberately.
#
# On pull requests as well as pushes: it is the gate that decides whether "portable" is true, and
# a portability regression is cheapest to catch before merge. A schedule catches environment drift
# in the dependencies, which changes without anyone touching this repository.

on:
  push:
    branches: [main, dev, openmm]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"          # Mondays, to catch upstream drift

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  integration:
    name: prepare, relocate, run and resume both routes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash -el {0}

    steps:
      - uses: actions/checkout@v4

      - name: create the documented CPU environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment-ci.yml
          environment-name: md-templates-ci
          cache-environment: true
          cache-downloads: true

      - name: record the environment under test
        run: |
          python --version
          python -c "import openmm; print('openmm', openmm.__version__)"
          python -c "from openmm import Platform; print('platforms', [Platform.getPlatform(i).getName() for i in range(Platform.getNumPlatforms())])"

      - name: build and install the wheel
        run: |
          python -m pip install --quiet build
          rm -rf dist && python -m build --wheel --outdir dist
          python -m pip install --no-deps dist/*.whl

      - name: CPU integration gate (prepare, relocate, run, resume, fallback, offline)
        timeout-minutes: 60
        run: bash scripts/ci/integration_cpu.sh "${RUNNER_TEMP}/integration"

      - name: real subprocess crash recovery
        timeout-minutes: 30
        run: python -m pytest tests/test_crash_recovery.py -q -m slow

      - name: bundle portability gates
        timeout-minutes: 40
        run: python -m pytest tests/test_bundle_portability.py -q -m slow

      - name: upload manifests and logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-diagnostics
          # manifests, status and logs only. Trajectories and checkpoints are deliberately
          # excluded: they are large and are not what a failure needs to be understood.
          path: |
            ${{ runner.temp }}/integration/**/bundle_manifest.json
            ${{ runner.temp }}/integration/**/checksums.json
            ${{ runner.temp }}/integration/**/canonical_configuration.json
            ${{ runner.temp }}/integration/**/run_state.json
            ${{ runner.temp }}/integration/**/status.json
            ${{ runner.temp }}/integration/**/*.log
          retention-days: 7
          if-no-files-found: ignore
