name: release-packaging

# The only workflow, and it validates PACKAGING -- not science.
#
# The runner has no GPU. Molecular dynamics runs on a GPU, so nothing here minimises, equilibrates
# or integrates anything: a green run on this machine would say the wheel installs and the
# commands parse, and it must not be read as saying the simulations are correct. Running MD on a
# CPU runner and calling the result validation is worse than not running it, because it produces a
# green tick that means something other than what people will take it to mean.
#
# GPU runtime acceptance comes from the local GPU machine:
#
#     CUDA_VISIBLE_DEVICES=0,1,2,3 pytest tests/ -q
#
# which runs the `gpu`-marked tests -- every stage, restart, cMD, REST2 and portability runtime
# test -- on CUDA. This workflow deselects exactly those.

on:
  workflow_dispatch:
  push:
    tags:
      - "openmm-v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false      # a release validation is not worth cancelling

permissions:
  contents: read

jobs:
  package:
    name: wheel, public commands, generation and non-MD tests (no simulation)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash -el {0}          # -l so the conda environment is activated

    steps:
      - uses: actions/checkout@v4

      - name: create the documented CPU preparation environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment-ci.yml
          environment-name: md-tools-ci
          cache-environment: true
          cache-downloads: true

      - name: record the environment under test
        run: |
          python --version
          python -c "import openmm; print('openmm', openmm.version.short_version)"
          python -c "from openmm import Platform; print('platforms', [Platform.getPlatform(i).getName() for i in range(Platform.getNumPlatforms())])"
          python -c "import openff.toolkit, openmmforcefields, parmed, rdkit.rdBase as r; print('openff', openff.toolkit.__version__, '| openmmforcefields', openmmforcefields.__version__, '| parmed', parmed.__version__, '| rdkit', r.rdkitVersion)"
          for exe in sqm antechamber tleap; do command -v "$exe" || { echo "::error::$exe missing from the environment"; exit 1; }; done

      - name: build and install the wheel
        run: |
          rm -rf dist && python -m build --wheel --outdir dist
          python -m pip install --no-deps dist/*.whl

      - name: validate the installed distribution
        run: |
          python -c "import md_tools, openmm; print(md_tools.__version__, openmm.__version__)"

      - name: the six public commands and project generation, from outside the checkout
        # Generation only. `md-gen` writes scripts; it does not run them.
        working-directory: ${{ runner.temp }}
        run: |
          md-openmm --help > /dev/null
          md-openmm show-default all > /dev/null
          md-openmm sys-config --method cMD REST2 --solvent OPC
          cp "${GITHUB_WORKSPACE}/tests/data/ALA.pdb" .
          python "${GITHUB_WORKSPACE}/scripts/shrink_configs_for_ci.py"
          md-openmm sys-gen -i ./ALA.pdb --config sys.config.yaml -of ./inputs/
          md-openmm md-gen -if ./inputs/ --config md.config.yaml -of ./MD/

      - name: the generated tree is the documented one (no simulation is run)
        working-directory: ${{ runner.temp }}
        run: |
          for stage in minimization eq/nvt_1kcal eq/npt_1kcal eq/npt_free; do
            for f in run.py run.sh stage.yaml; do
              test -f "MD/$stage/$f" || { echo "::error::MD/$stage/$f missing"; exit 1; }
            done
          done
          test -x MD/run_all.sh
          test -f MD/cMD/run.py && test -f MD/REST2/equilibrate.py && test -f MD/REST2/run.py
          test -d MD/REST2/replica_00/equilibration && test -d MD/REST2/replica_00/production
          echo "generated tree OK. No dynamics were run: this runner has no GPU."

      - name: the non-MD tests, with skips forbidden
        # Everything that minimises or integrates is marked `gpu` and is DESELECTED here, because
        # this runner cannot produce that evidence. Skips are still forbidden among what remains:
        # a packaging test that skipped because a dependency was missing is a test that did not
        # run, and that is a failure, not a pass with a note.
        run: python -m pytest tests/ -q -m "not gpu" --error-on-skip

      - name: state plainly what this job did NOT validate
        run: |
          echo "::notice title=No simulation validation::This job validated packaging only."
          echo "Every test that minimises or integrates a molecular system was deselected (-m 'not gpu')."
          echo "GPU runtime acceptance for this revision must come from the local GPU machine:"
          echo "    CUDA_VISIBLE_DEVICES=0,1,2,3 pytest tests/ -q"

      - name: upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-packaging-logs
          # diagnostics only: no trajectories, no checkpoints
          path: |
            dist/*.whl
            ${{ runner.temp }}/**/*.log
            ${{ runner.temp }}/**/*.yaml
          retention-days: 14
          if-no-files-found: ignore
