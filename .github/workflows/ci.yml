name: ci

# WHAT THIS JOB IS EVIDENCE FOR, AND WHAT IT IS NOT
#
# It validates PACKAGING AND INTERFACE: that the wheel installs, that the four public commands
# exist and work from outside the checkout, that the shipped configuration examples are found
# through distribution metadata and validate, that every protocol generates a bundle whose scripts
# compile, and that the exported schemas match their models.
#
# It runs NO DYNAMICS and produces NO SCIENTIFIC EVIDENCE. There is no CUDA runner configured, and
# CPU execution is never substituted for CUDA evidence: the GPU lane is recorded locally and named
# in the release notes. A green run here means the package is well formed, not that the science is
# right.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [dev, main]
    tags:
      # MD-tools' own convention. The historical `openmm-v*` tags belong to this package when it
      # was called MD-templates and must not trigger a release validation for this one.
      - "v*"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  package:
    name: wheel, four commands, configs, schemas and the non-GPU lane
    runs-on: ubuntu-latest
    defaults:
      run:
        # `-o pipefail` is not decoration. Without it a pipeline's exit status is the LAST
        # command's, so `pytest ... | tee pytest.log` reports `tee`'s success and `-e` never
        # fires. This job was displayed as green for a run in which pytest printed
        # "14 failed, 1108 passed" -- the worst possible failure mode for a CI job, because it
        # is the one nobody investigates.
        shell: bash -elo pipefail {0}
    steps:
      - uses: actions/checkout@v4

      - name: create the documented environment
        # ONE environment file, and it carries `cuda-version` and MPI. On this runner the CUDA
        # stack is INERT -- there is no driver, so OpenMM offers Reference and CPU only -- and
        # nothing in this job claims CUDA evidence: the GPU lane is separate, local, and named in
        # the release notes. It costs a larger solve and buys one description of the environment
        # instead of two that drifted apart, which is how the test lane below came to be passing
        # `--dist` to a pytest with no xdist installed.
        #
        # `mpi4py` being present changes nothing here either: the tests that prove a plural launch
        # without working MPI refuses and writes nothing FORCE its absence rather than relying on
        # this environment to lack it.
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment.yml
          environment-name: openmm-env
          cache-environment: true
          cache-downloads: true

      - name: record the environment under test
        run: |
          python --version
          python -c "import openmm; print('openmm', openmm.version.short_version)"
          python -c "from openmm import Platform; print('platforms', [Platform.getPlatform(i).getName() for i in range(Platform.getNumPlatforms())])"
          python -c "import openff.toolkit, openmmforcefields, parmed, rdkit.rdBase as r; print('openff', openff.toolkit.__version__, '| openmmforcefields', openmmforcefields.__version__, '| parmed', parmed.__version__, '| rdkit', r.rdkitVersion)"
          for exe in sqm antechamber tleap; do command -v "$exe" || { echo "::error::$exe missing from the environment"; exit 1; }; done

      - name: build and install the wheel
        run: |
          python -m pip install --quiet build
          python -m build --wheel
          python -m pip install --quiet --no-deps dist/*.whl
          mkdir -p "${RUNNER_TEMP}/outside"

      - name: prove the installed package is the wheel, not the checkout
        working-directory: ${{ runner.temp }}/outside
        run: |
          python - <<'PY'
          import md_tools, sys
          origin = md_tools.__file__
          print("md_tools:", origin)
          assert "site-packages" in origin, f"imported the checkout: {origin}"
          assert not any(p.endswith("/src") for p in sys.path), sys.path
          PY

      - name: the four public commands
        working-directory: ${{ runner.temp }}/outside
        run: |
          md-openmm -h
          md-openmm --version
          md-openmm build-top -h
          md-openmm build-md -h
          md-openmm md-run -h
          md-openmm data-register -h

      - name: md-run help must not need a GPU or an OpenMM context
        working-directory: ${{ runner.temp }}/outside
        # The runner has no CUDA device. `-h` is what somebody reads before submitting a job, so
        # it has to answer on a machine that could not run the job at all.
        run: |
          md-openmm md-run -h | tee help.txt
          for flag in -i -p -x -c -o -r -log -odir -ng -source-traj --cpu; do
            grep -q -- "$flag" help.txt || {
              echo "::error title=md-run flag missing::$flag is not documented"; exit 1; }
          done

      - name: md-run refuses -ng outside an MPI launch
        working-directory: ${{ runner.temp }}/outside
        # `-ng` says how many processes coordinate; it does not create them. Accepting it in a
        # single process would run a ladder in one rank while claiming otherwise.
        #
        # This step was RED for two commits. It passed an XML through `-x` and omitted the
        # mandatory `-s`, so argparse refused it first: the command exited non-zero for the wrong
        # reason and the MPI check it is named after never ran. A test that fails for the wrong
        # reason is worse than no test, so the argparse case is now detected explicitly rather
        # than being indistinguishable from success.
        run: |
          # A LADDER READS -s ONLY FROM ITS GROUP FILE (0.5.4). This step used to pass `-s`, which
          # that rule refuses BEFORE the MPI check -- so from 0.5.4 until this repair the step
          # exited non-zero for the wrong reason and the refusal it is named for never ran. The
          # fixture below was executed before it was written down. Dummy XMLs are enough on
          # purpose: the coordination check is reached before any System is deserialised, which is
          # what keeps this step cheap and honest rather than a build in disguise.
          printf '&cntrl\n  protocol = REST2,\n/\n&remd\n  number_of_replicas = 4,\n/\n' > ladder.in
          printf 'END\n'       > built.pdb
          printf '<System/>\n' > built.xml
          printf '<State/>\n'  > state.xml
          printf '#\n'         > p.py
          for i in 0 1 2 3; do
            printf -- '-i p.py -p built.pdb -s built.xml -c state.xml --group-index %s\n' "$i" >> group
          done
          if md-openmm md-run -ng 4 \
               -i ladder.in \
               -p built.pdb \
               -groupfile group \
               -odir out >out.txt 2>&1; then
            echo "::error title=-ng accepted with no launcher::md-run exited 0"; exit 1
          fi
          if grep -qE "the following arguments are required|unrecognized arguments" out.txt; then
            echo "::error title=Argparse refused first::the flags do not match the current"\
                 " contract, so the MPI refusal was never reached"; cat out.txt; exit 1
          fi
          # THE SECOND WRONG REASON, and the one that actually bit: a protocol rule refusing before
          # the MPI check. The guard above only ever recognised argparse, so it caught the 2024
          # shape of this mistake and not the 0.5.4 one. Both are named now.
          if grep -q "reads -s only from its group file" out.txt; then
            echo "::error title=The ladder flag rule refused first::the MPI refusal was never"\
                 " reached"; cat out.txt; exit 1
          fi
          grep -q "not started by an MPI launcher" out.txt || {
            echo "::error title=Wrong refusal::"; cat out.txt; exit 1; }
          # A refused preflight must leave nothing behind: a -odir holding a resolved.config is
          # indistinguishable from a run that happened.
          if [ -e out ]; then
            echo "::error title=Preflight wrote output::-odir was created by a refused launch"
            ls -la out; exit 1
          fi
          echo "refused before any output, for the right reason"

      - name: no second executable is installed
        working-directory: ${{ runner.temp }}/outside
        run: |
          for gone in openmm-md md-template md-data-register md-data-finish; do
            if command -v "$gone" >/dev/null 2>&1; then
              echo "::error title=Retired executable installed::$gone is on PATH"
              exit 1
            fi
            echo "absent: $gone"
          done

      - name: the shipped configuration examples
        working-directory: ${{ runner.temp }}/outside
        run: |
          python - <<'PY'
          from md_tools.build.md import resolve_md_config
          from md_tools.build.top import resolve_build_config
          from md_tools.configs import EXAMPLES, example, example_root

          root = example_root()
          print("located through distribution metadata:", root)
          # The exact set from the documented `configs/` tree -- stronger than any count, and it
          # fails both when a file stops shipping and when an undeclared one appears.
          expected = {
              "machine/user.config.example",
              "sys/build-top.config",
              "md/cMD.config",
              "md/REST2.config",
              "md/AIS.config",
          }
          assert {str(r) for r in EXAMPLES} == expected, sorted(str(r) for r in EXAMPLES)
          missing = [str(r) for r in EXAMPLES if not (root / r).is_file()]
          assert not missing, f"declared but not shipped: {missing}"

          resolve_build_config(example("sys/build-top.config"))
          for name in ("cMD", "REST2", "AIS"):
              resolved = resolve_md_config(example(f"md/{name}.config"))
              assert resolved["protocol"] == name, (name, resolved["protocol"])
          print("five shipped examples present and resolving")
          PY

      - name: the documented examples, through the same resolvers
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path

          from md_tools.build.md import resolve_md_config
          from md_tools.data_contract.extension import Extension
          from md_tools.data_contract.model import Dataset

          docs = Path("docs")
          for name in ("cMD", "REST2", "AIS"):
              path = docs / "openmm_methods" / name / "example.config"
              assert resolve_md_config(path)["protocol"] == name, path
          print("three documented method examples resolve")

          Dataset.model_validate(
              yaml.safe_load((docs / "data_register" / "dataset.yaml.example").read_text()))
          Extension.model_validate(
              yaml.safe_load((docs / "data_register" / "extension.yaml.example").read_text()))
          print("registration examples validate against their models")
          PY

      - name: the public API imports from the wheel
        working-directory: ${{ runner.temp }}/outside
        run: |
          python - <<'PY'
          from md_tools.ais import run_generated_ais
          from md_tools.md import (PositionalRestraint, ReportingConfig, run_generated_stage,
                                   run_stage)
          from md_tools.remd import (NeighborExchangeRule, REMDRunner, run_generated_remd,
                                     run_remd)
          from md_tools.rest2 import REST2Scaler, ScalingSelection

          print("every documented public name imports")
          PY

      - name: the retired runtime layout is not in the wheel
        working-directory: ${{ runner.temp }}/outside
        run: |
          python - <<'PY'
          import importlib
          from pathlib import Path

          import md_tools

          root = Path(md_tools.__file__).parent
          assert not (root / "openmm" / "templates").exists(), "openmm/templates shipped"
          for gone in ("md_tools.openmm.templates", "md_tools.openmm.ais"):
              try:
                  importlib.import_module(gone)
              except ModuleNotFoundError:
                  continue
              raise SystemExit(f"{gone} is still importable")
          # The packages a generated script actually calls.
          for package in ("md", "rest2", "remd", "ais"):
              assert (root / package / "__init__.py").is_file(), package
          print("openmm/templates gone; the four runtime packages ship")
          PY

      - name: generate and compile every protocol bundle
        working-directory: ${{ runner.temp }}/outside
        run: |
          python - <<'PY'
          import ast, os, py_compile, shutil, subprocess, yaml
          from pathlib import Path

          SHORT = {"stages": {"minimization_iterations": 10, "restrained_nvt_steps": 10,
                              "restrained_npt_steps": 10, "unrestrained_npt_steps": 10,
                              "production_steps": 10},
                   # The names 7d76b05 gave these. They were renamed in the source, the tests
                   # and the docs, and not here -- so every CI run since has failed on this step
                   # while the suite it guards was green, because the schema refuses unknown keys
                   # rather than ignoring them.
                   "reporting": {"crd_printout_solute": 10, "crd_printout_whole": 10,
                                 "info_printout": 10, "checkpoint_printout": 10}}
          # A BUILT SYSTEM FIRST, because 0.5.3 moved rung scaling to build time: `build-md` for a
          # ladder deserialises `../build/built.xml`, scales it to every rung and serialises the
          # result, so REST2 cannot be generated from an empty directory any more. Two
          # Systems are enough -- one explicit, one implicit -- and they are built with the REAL
          # `build-top` rather than a hand-parameterised stand-in, because this step is the one
          # that claims the shipped commands work together. ALA is small: ~2.5 s each, tleap
          # included.
          structure = Path(os.environ["GITHUB_WORKSPACE"]) / "tests" / "data" / "ALA.pdb"
          systems = {
              "explicit": {"solvent": {"model": "TIP3P", "padding_nm": 0.6, "cutoff_nm": 0.6}},
              "implicit": {"solvent": {"model": "GBn2"}},
          }
          for label, document in systems.items():
              config = Path(f"sys-{label}.config")
              config.write_text(yaml.safe_dump(document, sort_keys=False), encoding="utf-8")
              built = Path(f"sys-{label}")
              done = subprocess.run(
                  ["md-openmm", "build-top", "-i", str(structure), "--config", str(config),
                   "-os", str(built / "built.xml"), "-op", str(built / "built.pdb"),
                   "-log", str(built / "built.log")],
                  capture_output=True, text=True)
              assert done.returncode == 0, f"build-top {label}: {done.stdout}{done.stderr}"
              print(f"built the {label} System")

          cases = [
              # THE 0.5.3 LAYOUT, and the second time this step has been left behind by a rename.
              # It used to expect `min.py` and three `eq_<ensemble>.py` flat in the run directory.
              # They are not there any more and it is not a bug: `min/` and `input/` are SHARED by
              # every run on a system and are written as SIBLINGS of the run directory, while
              # equilibration is filed by position inside `eq/` (`eq_1.py`, `eq_2.py`, `eq_3.py`)
              # so that a renamed stage cannot make a filename claim something false. The run
              # directory holds the production entry point and the declarations, and nothing else.
              #
              # The implicit case no longer differs here either: the ensemble left the filename,
              # so `eq_nvt_posres_2.py` / `eq_nvt_free.py` have the same names as the explicit
              # ones and the difference is recorded in each stage's `.out` and resolved config.
              #
              # Each entry names the System it needs, because an explicit and an implicit run are
              # not the same system and must not share one.
              ("cMD-explicit", "explicit", {"protocol": "cMD", "solvent": "explicit", **SHORT}, [],
               {"cMD.py", "run.sh", "resolved.config", "run.config", "build-md.log", "eq"}),
              ("cMD-implicit", "implicit", {"protocol": "cMD", "solvent": "implicit", **SHORT}, [],
               {"cMD.py", "run.sh", "resolved.config", "run.config", "build-md.log", "eq"}),
              ("REST2", "explicit", {"protocol": "REST2", "solvent": "explicit", **SHORT,
                         "rest2": {"number_of_replicas": 2, "exchange_interval_steps": 10,
                                   "number_of_exchanges": 2}}, [],
               # `remd0`/`remd1` and `build_states.log` were the 0.5.x layout, when build-md
               # scaled the rungs itself and wrote a directory per replica. The states are now
               # built by `build-top --rest2-scaler` into `build/REST2/` and the run directory
               # holds the entry point, the declarations and the per-rank tree.
               {"REST2.py", "run.sh", "resolved.config", "run.config", "build-md.log",
                "eq", "remd_groupfile.1", "remd_records", "rank"}),
              ("AIS", "explicit", {"protocol": "AIS", "solvent": "explicit",
                       "ais": {"number_of_paths": 2, "switching_steps": 20,
                               "observation_interval_steps": 10},
                       "ais_source": {"trajectory": "../source.dcd"}}, [],
               {"AIS.py", "run.sh", "resolved.config", "build-md.log"}),
          ]
          for name, system, document, extra, expected in cases:
              config = Path(f"{name}.config")
              config.write_text(yaml.safe_dump(document, sort_keys=False), encoding="utf-8")
              # ONE DATASET ROOT PER CASE, because `build-md` writes more than `-odir`. The
              # shared `input/` and `min/` are SIBLINGS of the run directory, and they belong to
              # the system rather than the run -- so six protocols generated into one parent are
              # six runs claiming one `input/min.in`, and the second is refused by name because an
              # explicit and an implicit system do not resolve the same inputs. That refusal is
              # correct and is the layout working; generating them flat was the mistake.
              root = Path(name)
              (root / "build").mkdir(parents=True, exist_ok=True)
              for artefact in ("built.xml", "built.pdb", "built.solute.pdb", "built.log"):
                  source = Path(f"sys-{system}") / artefact
                  if source.is_file():
                      shutil.copy2(source, root / "build" / artefact)
              # A HOT LADDER NEEDS ITS SAVED STATES FIRST. Since 0.6.0 `build-md` refuses a
              # REST2 run until `build/<method>/scaler.yaml` exists: every scaled Hamiltonian is
              # written as a file by `build-top --rest2-scaler` and never re-derived at run time.
              # This step generated the bundle straight from `build-md` and had been failing on
              # that refusal -- the CI reporting a contract it had not been taught.
              if name == "REST2":
                  scaler = Path(f"scaler-{name}.config")
                  scaler.write_text(yaml.safe_dump(
                      {"method": "REST2",
                       "schedule": {"n_states": 2, "tau_min": 0.0, "tau_max": 0.5}},
                      sort_keys=False), encoding="utf-8")
                  states = subprocess.run(
                      ["md-openmm", "build-top", "--rest2-scaler",
                       "-s", str(root / "build" / "built.xml"),
                       "-p", str(root / "build" / "built.pdb"),
                       "--config", str(scaler)],
                      capture_output=True, text=True)
                  assert states.returncode == 0, f"{name} scaler: {states.stdout}{states.stderr}"
                  assert (root / "build" / "REST2" / "scaler.yaml").is_file(), f"{name}: no scaler.yaml"

              out = root / f"{name}-run1"
              result = subprocess.run(
                  ["md-openmm", "build-md", "-odir", str(out), "--config", str(config), *extra],
                  capture_output=True, text=True)
              assert result.returncode == 0, f"{name}: {result.stdout}{result.stderr}"
              written = {p.name for p in out.iterdir()}
              assert expected <= written, f"{name}: expected {expected}, got {sorted(written)}"
              assert (out / "resolved.config").is_file(), f"{name}: no resolved.config"
              # rglob, not glob: the equilibration entry points moved into `eq/` with the 0.5.3
              # layout, and a top-level glob stopped seeing them -- so the compile-and-compactness
              # checks below silently covered one script per protocol instead of all of them.
              for script in out.rglob("*.py"):
                  py_compile.compile(str(script), doraise=True)
                  text = script.read_text(encoding="utf-8")
                  assert "/home/" not in text and "/runner/" not in text, f"{name}: absolute path"
                  # A generated script is an ENTRY POINT: one import of the stable API and one
                  # call. A definition, an argparse or an OpenMM import means the implementation
                  # has leaked back into the generated file, where it would have as many versions
                  # as there are generated directories.
                  tree = ast.parse(text)
                  statements = [n for n in tree.body
                                if not (isinstance(n, ast.Expr)
                                        and isinstance(n.value, ast.Constant))]
                  kinds = [type(n).__name__ for n in statements]
                  assert kinds == ["ImportFrom", "Raise"], f"{name}/{script.name}: {kinds}"
                  body = text.split('"""', 2)[-1]
                  for forbidden in ("argparse", "import openmm", "STAGE = {", "LADDER = {"):
                      assert forbidden not in body, f"{name}/{script.name} contains {forbidden}"
              print(f"{name}: {len(written)} files, all compile, compact, no absolute path")

          ais = {p.name for p in (Path("AIS") / "AIS-run1").iterdir()}
          # AIS consumes an ensemble that already exists, so it generates no chain of its own.
          # Checked on the RUN directory: the dataset root beside it legitimately carries the
          # `build/` this step put there.
          assert not any(n.startswith(("min", "eq_")) for n in ais), ais
          print("AIS carries no equilibration chain")
          PY

      - name: dataset and extension schemas
        working-directory: ${{ runner.temp }}/outside
        run: |
          python - <<'PY'
          import json

          from md_tools.data_contract import exported_schema_path
          from md_tools.data_contract.extension import json_schema as extension_schema
          from md_tools.data_contract.model import json_schema as dataset_schema

          for which, render in (("dataset", dataset_schema), ("extension", extension_schema)):
              path = exported_schema_path(which)
              committed = json.loads(path.read_text(encoding="utf-8"))
              assert committed == render(), f"{which} schema has drifted from its model"
              print(f"{which}: {path.name} matches its model")
          PY

      - name: prove this job cannot be green while a piped command fails
        # The guard on the guard. Every step below pipes through `tee`, and for one release this
        # job reported success while pytest printed "14 failed". A comment saying "pipefail is
        # set" is not evidence that it is set in the shell these steps actually run in, so this
        # asserts it from inside that shell -- and asserts the FIX, not the setting: a failing
        # command upstream of a pipe must make the step fail.
        run: |
          echo "shell options: $-"
          case "$-" in *e*) ;; *) echo "::error::errexit is not set"; exit 1;; esac
          [[ -o pipefail ]] || { echo "::error::pipefail is not set"; exit 1; }
          # A subshell, because the failure has to be observed rather than inherited.
          if ( set -eo pipefail; false | tee /dev/null ); then
            echo "::error title=CI can mask failures::a failing command upstream of tee did not fail the pipeline"
            exit 1
          fi
          echo "a failing command upstream of tee correctly fails the pipeline"

      - name: the non-GPU test lane
        run: |
          # `reference_data` is DESELECTED, not skipped. Those tests read the migrated reference
          # dataset under `data/`, which is gitignored and can never exist on a runner -- so the
          # no-skip rule below was asserting something structurally impossible here, and the lane
          # could not go green whatever the code did. Deselecting says the honest thing ("its
          # input is not in the repository"); skipping would say "a test that should have run did
          # not", which is what the rule exists to catch.
          python -m pytest tests -m "not slow and not gpu and not reference_data" \
            -q -rs --tb=short | tee pytest.log
          # A skip here is not neutral: it means a test that should have run did not, and a green
          # run would report coverage the job did not actually have.
          if grep -qE "^SKIPPED|[0-9]+ skipped" pytest.log; then
            echo "::error title=Unexpected skip::A test skipped in the non-GPU lane; see the log."
            exit 1
          fi

      - name: state plainly what this job did NOT validate
        if: always()
        run: |
          echo "::notice title=No simulation validation::This job validated packaging, the FOUR-command interface (build-top, build-md, md-run, data-register), the shipped examples, bundle generation and the schemas. It ran no dynamics. GPU/scientific validation is a separate locally recorded lane; see docs/release-notes/."

      - name: upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            pytest.log
            ${{ runner.temp }}/outside/**/*.log
            ${{ runner.temp }}/outside/**/*.config
          if-no-files-found: ignore
          retention-days: 14
