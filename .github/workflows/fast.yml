name: fast

# The quick gate: every push and pull request. It builds the wheel, checks the packaged
# resources, installs it, runs the public commands from outside the checkout, and runs the
# non-slow suite. The steps live in scripts/ci/fast_checks.sh so that what CI does and what a
# developer can run locally cannot drift apart.

on:
  push:
    branches: [openmm, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: fast-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast:
    name: wheel, packaged resources, unit suite
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -el {0}          # -l so the conda environment is activated

    steps:
      - uses: actions/checkout@v4

      - name: create the documented CPU environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: environment-ci.yml
          environment-name: md-templates-ci
          cache-environment: true
          # The environment is cached; generated scientific results never are.
          cache-downloads: true

      - name: record the environment under test
        run: |
          python --version
          python -c "import openmm; print('openmm', openmm.__version__)"
          python -c "import pydantic; print('pydantic', pydantic.VERSION)"

      - name: install the build front end
        run: python -m pip install --quiet build

      - name: fast checks
        run: bash scripts/ci/fast_checks.sh "${RUNNER_TEMP}/fast"

      - name: bundle relocation and integrity tests that fit the fast budget
        run: python -m pytest tests/test_bundle_portability.py -q -m "not slow"

      - name: upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fast-logs
          # concise diagnostics only: no trajectories, no checkpoints
          path: |
            dist/*.whl
            ${{ runner.temp }}/fast/**/*.json
            ${{ runner.temp }}/fast/**/*.log
          retention-days: 7
          if-no-files-found: ignore
