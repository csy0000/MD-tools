# ACE-ALA-NME — the ff19SB PEPTIDE route, exercised end to end.
#
# The package has always been able to run two routes: `smiles` -> Sage/openff-2.2.0 as a ligand,
# and `pdb` -> ff19SB as a peptide. Only the first was ever exercised. Every shipped system was a
# ligand, and all three peptide-route tests assert REFUSALS -- that a peptide cannot silently
# become a Sage run, that a PDB hash mismatch is rejected, that RGD rejects a pdb route. They prove
# you cannot reach ff19SB by accident; none of them proves you can reach it on purpose.
#
# This manifest is the smallest honest peptide: alanine dipeptide, ACE-ALA-NME, 22 atoms, neutral,
# built by tleap from `source leaprc.protein.ff19SB; sequence { ACE ALA NME }`. Every residue is one
# ff19SB recognises, so the route inference resolves to `peptide` from the input itself rather than
# from a system preset, and CMAP is exercised because ff19SB carries one.
#
# It is a ROUTE test, not a science system. Alanine dipeptide in explicit water says nothing about
# macrocycle ladders, and nothing measured here should be quoted as if it did.
schema_version: 1
system_id: ace_ala_nme
display_name: ACE-ALA-NME (alanine dipeptide), ff19SB peptide route

input:
  route: pdb
  pdb: ace_ala_nme.pdb
  pdb_sha256: "dd50bd9cb68713d7705e204fbc84897e2c3a9b33c135fd3574bda0edebaa3bd4"
  expected_formal_charge: 0

# A peptide route may NOT also name a small-molecule force field -- the schema refuses it, because
# that is exactly how a peptide silently becomes a Sage ligand run. small_molecule_forcefield and
# charge_method are therefore null: there is no ligand here and no AM1-BCC step.
parameterization:
  small_molecule_forcefield: null
  charge_method: null
  protein_forcefield: amber19/protein.ff19SB.xml
  water_forcefield: amber19/tip3pfb.xml

# 1.2 nm padding in a cube, matching the smoke system's rationale: large enough that the natural
# box already exceeds twice the cutoff, so the box-growth policy never has to grow it and the
# first NPT step cannot shrink it below the minimum-image limit.
solvation:
  water_model: tip3p
  padding_nm: 1.2
  box_shape: cube
  ionic_strength_molar: 0.0
  positive_ion: Na+
  negative_ion: Cl-

chemistry:
  molecular_formula: C6H12N2O2
  n_stereocentres: 1
  sequence: ACE-ALA-NME
