# cyclo-(RGDfV) ten-rung ladder — TARGET-MACHINE MECHANICAL SMOKE. NOT a scientific run.
#
# Copied from the transferred rgd_rest2_10rung.yaml (sha256
# a41a73be487d3f59b95b4d88f08016ab8488e2d8bc62b73668110ea6eb6201e7) with ONLY runtime fields
# changed, per claudecode-instructions/20260815-explicit-test-2.md section 8:
#
#   experiment_id            rgd_rest2_10rung -> rgd_target_mechanical_smoke
#   exchange_interval_ps     10.0             -> 1.0
#   relaxation_ps            10.0             -> 1.0
#   total_ns_per_replica     2.0              -> 0.002      (2 ps -> exactly 2 exchange rounds)
#   chunk_ns                 1.0              -> 0.001
#
# UNCHANGED: the ten exact scale factors, the integrator (langevin-middle, 300 K, 4 fs), and the
# platform precision. Force field, solvation, cutoff, constraints, HMR, box shape and equilibration
# live in the SYSTEM manifest and the prepared bundle and are not touched here.
#
# MASTER SEED DELIBERATELY NOT CHANGED, against the letter of the instruction's template.
# Section 8 prescribes `master_seed: 20260815` while also saying to change ONLY runtime fields.
# Those two requirements contradict each other: `master_seed` is build-defining, not runtime. It
# derives `structure.etkdg.seed` and `equilibration.seed`, both of which determined the System and
# the equilibrated state stored in the bundle. Setting it to 20260815 was tried first and the
# package's fingerprint guard correctly refused the run (exit 8, `incompatible experiment`,
# naming equilibration.seed 20260815 -> 20260816 and structure.etkdg.seed 20260814 -> 20260815).
# Honouring the prescribed seed would require re-preparing the bundle (~790 s) and would defeat
# section 8's own premise of running against the section 7 bundle. The seed is therefore held at
# the bundle's 20260814 and only the `rest2:` runtime block differs.
#
# This run proves that ten replicas build, propagate and attempt their nine neighbouring exchanges
# on this machine. It says nothing about the ladder, about convergence, or about the 2 fs / 4 fs
# equivalence gate, which remains open.
schema_version: 1
experiment_id: rgd_target_mechanical_smoke
master_seed: 20260814
ladder_status: pilot_supported

integrator:
  kind: langevin-middle
  temperature_k: 300.0
  timestep_fs: 4.0

rest2:
  scale_factors: [1.000000000000, 0.891975308642, 0.790123456790, 0.694444444444,
                  0.604938271605, 0.521604938272, 0.444444444444, 0.373456790123,
                  0.308641975309, 0.250000000000]
  exchange_interval_ps: 1.0
  relaxation_ps: 1.0
  total_ns_per_replica: 0.002
  chunk_ns: 0.001

platform:
  precision: mixed
