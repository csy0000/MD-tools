# Hydrogen mass repartitioning at 4 fs -- an explicit performance option, never a default.
#
# This file is not a configuration on its own. It lists the exact keys to change in each of the
# two files `md-openmm sys-config` writes, so a reader can see the whole change in one place: the
# mass lives in the system file and the timestep lives in the protocol file, each looks reasonable
# alone, and only the pair is a decision.
#
#   md-openmm sys-config --method cMD --solvent TIP3P     # then apply the edits below
#   md-openmm sys-gen -i ./peptide.pdb --config sys.config.yaml -of ./inputs/
#   md-openmm md-gen  -if ./inputs/ --config md.config.yaml   -of ./MD/
#
# `md-gen` refuses 4 fs without all three of the system-side settings, naming both files.
#
# WHAT THIS BUYS, AND WHAT IT COSTS
#
#   buys   roughly a factor of two in wall-clock per nanosecond, with no change to the box, the
#          force field, or the number of particles.
#   costs  the masses are no longer physical. Equilibrium configurational averages are unchanged
#          -- the Boltzmann distribution in configuration space does not depend on masses -- but
#          time correlation functions, rates, diffusion constants and every other dynamical or
#          transport observable are computed from a system whose inertia has been altered. A short
#          stable smoke run is evidence of stability, not of kinetic validity.
#
# Before using it on a system class you have not run before, compare a few hundred picoseconds
# against the 2 fs baseline: total energy drift, temperature, density, and any structural quantity
# you care about. That check belongs to your project, not to this repository.

sys.config.yaml:
  constraints:
    # Bonds to hydrogen must be constrained. HMR lowers the hydrogen ANGLE frequencies; the bond
    # stretches it does not touch are the fastest motions in the system.
    type: HBonds
    # Water is never repartitioned, so a flexible water keeps its ~10 fs O-H stretch and would set
    # the stable timestep for the whole box on its own.
    rigid_water: true
    # The target hydrogen mass. Each hydrogen is raised to this and its bonded heavy atom loses
    # exactly what the hydrogen gained, so every heavy-atom/hydrogen group conserves mass. sys-gen
    # verifies that group by group against the same System built without HMR, and refuses a target
    # that would drive a heavy atom to a nonpositive mass.
    hydrogen_mass_amu: 3.024

md.config.yaml:
  common:
    timestep_fs: 4.0
    # Unchanged, and worth seeing next to the timestep: the barostat attempt interval is in STEPS,
    # so 25 steps is 0.10 ps here against 0.05 ps at the 2 fs baseline.
    barostat_frequency_steps: 25
