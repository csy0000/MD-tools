# HISTORICAL. The environment for the pre-CLI explicit-solvent baseline, kept to
# interpret reports/explicit_solvent/. The current environment is environment-ci.yml
# at the repository root, which is the environment MD-tools is tested against.
# Environment for the explicit-solvent baseline.
#
#   conda env create -f docs/implementation/explicit_solvent/environment.yml
#   conda activate md-tools
#
# then EITHER build and install a wheel (the portable route, and what a consuming repository
# does -- no source checkout required afterwards):
#
#   python -m build                       # from the repository root; writes dist/md_tools-*.whl
#   python -m pip install dist/md_tools-*.whl --no-deps
#
# OR install the checkout in place, for development:
#
#   pip install -e . --no-deps            # from the repository root
#
# Either way it is `--no-deps`, so EVERY runtime dependency declared in pyproject.toml must be
# listed HERE -- pip will not pull them in.  numba is the one that is easy to miss.  The wheel
# route additionally puts the `md-openmm` console script on PATH; see
# docs/implementation/explicit_solvent/PORTABLE_REST2.md.
#
# THIS IS NOT A LOCK FILE.  It pins the primary package versions the baseline was validated
# against; build strings and transitive dependencies are unpinned, so conda is free to resolve
# those differently on another day or platform.  Treat it as "validated primary package versions",
# not as a guarantee of bit-identical reproduction.  If a true lock is ever needed, generate a
# platform-specific one (`conda list --explicit`) and commit that alongside.
#
# ACTIVATE THE ENVIRONMENT BEFORE RUNNING ANYTHING.  AM1BCC charge assignment goes through
# AmberTools' `sqm`, which the OpenFF toolkit discovers by looking for it on PATH.  In a bare shell
# it is not found even though it is installed, AmberToolsToolkitWrapper is silently absent from the
# toolkit registry, and AM1BCC becomes unavailable.  build_forcefield() checks and fails loudly
# rather than letting the charges fall back to another method under an AM1BCC label.

name: md-tools

channels:
  - conda-forge
  - nodefaults                # no channel mixing: conda-forge only

dependencies:
  # 3.11.15 is what the validation ran on; the series is pinned rather than the patch so the
  # environment stays solvable.  See the "not a lock file" note above.
  - python=3.11

  # --- packaging / test toolchain (needed because the install is `pip install -e . --no-deps`) --
  - pip
  - setuptools>=64            # PEP 660 editable installs
  - python-build                     # `python -m build` -> the wheel a consuming repository installs
  - pytest
  - git

  # --- simulation engine -----------------------------------------------------------------------
  # 8.5.1 supplies both Modeller.addSolvent(boxShape=...) and
  # DCDReporter(atomSubset=..., enforcePeriodicBox=...), which the baseline depends on.
  - openmm=8.5.1
  - openmmtools=0.26.0        # NEQ integrators; not used by this template

  # LINUX / CUDA environment.  For a CPU-only or non-NVIDIA machine, DELETE the next line --
  # OpenMM still provides the Reference and CPU platforms, and every stage runs on
  # `production.platform: CPU`, only slower.
  - cuda-version=13.0

  # --- force fields ----------------------------------------------------------------------------
  - openmmforcefields=0.16.0  # SMIRNOFFTemplateGenerator -> Sage 2.2 (openff-2.2.0)
  - openff-toolkit=0.17.1
  - openff-interchange=0.4.5
  - ambertools=24.8           # sqm, for AM1BCC.  MUST be on PATH -- see the note above.
  - parmed=4.3.1              # the enforced GBn2/mbondi3 implicit route

  # --- structure generation --------------------------------------------------------------------
  - rdkit=2025.03.6           # ETKDGv3 embedding, MMFF94s minimisation, amide SMARTS matching

  # --- analysis --------------------------------------------------------------------------------
  # pymbar is a first-class dependency of the analysis that follows these runs -- the MBAR + Zwanzig
  # hot term for window-strat-cBAR, and the all-replica MBAR cold reference.  It arrived here only
  # as a transitive dependency of openmmtools before, which is not something to rely on.
  - pymbar=4.2.0
  - mdtraj=1.11.1             # trajectory reading and CV extraction (NOT used by the writers)
  - numba                     # declared in pyproject.toml; --no-deps will not install it
  - numpy=2.4.6
  - scipy=1.17.1
  - pandas=2.3.3
  - matplotlib=3.10.9
  - scikit-learn=1.9.0
  - netcdf4=1.7.2

  # --- convenience -----------------------------------------------------------------------------
  - pyyaml
  - tqdm
  - ipykernel
